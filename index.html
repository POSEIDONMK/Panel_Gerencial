<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel Poseidón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F9; --surface:#FCFCFB; --ink:#0B2530; --ink2:#3F5763; --muted:#6B7F8A; --line:#D7DFEA; --line2:#E7ECF3;
  --teal:#0A6CE0; --teal-d:#0757B5; --teal-bg:#DCEAFB; --navy:#070B14; --navy2:#0B1220; --cyan:#38E0FF; --gold:#FFB020; --orange:#E07B00; --rust:#C2410C; --rust-bg:#FBE6DB; --amber:#A16207; --amber-bg:#F8EBC8; --blue-bg:#E1ECF2;
  --head:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif; --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ── acceso ── */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-box{width:100%;max-width:380px}
.login-box h1{font:700 34px/1.1 var(--head);margin:0 0 6px;letter-spacing:-.02em}
.login-box p{margin:0 0 22px;color:var(--ink2)}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.field{display:block;margin-bottom:14px;font-weight:500;font-size:13px;color:var(--ink2)}
.field input{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:15px}
.btn{border:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-weight:600}
.btn:hover{background:#12384a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line2)}
.btn.danger{background:var(--rust)}
.msg{min-height:20px;margin-top:12px;font-size:13.5px;color:var(--rust)}
.msg.ok{color:var(--teal-d)}

/* ── estructura ── */
#app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
nav.rail{position:sticky;top:0;height:100vh;padding:26px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--paper)}
.brand{font:700 20px/1 var(--head);padding:0 10px 22px;letter-spacing:-.01em}
.brand small{display:block;margin-top:6px;font:500 12px/1 var(--body);color:var(--muted);letter-spacing:0}
.nav-b{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;color:var(--ink2);font-weight:500}
.nav-b:hover{background:var(--line2)}
.nav-b[aria-current=page]{background:var(--ink);color:#fff}
.nav-b .dot{margin-left:auto;min-width:20px;text-align:center;font-size:12px;border-radius:999px;background:var(--rust);color:#fff;padding:1px 6px}
.rail-foot{margin-top:auto;padding:10px;font-size:12.5px;color:var(--muted)}
.rail-foot button{margin-top:8px}
main{padding:34px clamp(18px,4vw,52px) 80px;max-width:1180px;width:100%}
h2.sec{font:700 30px/1.1 var(--head);letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--ink2);margin:0 0 26px}
h3{font:700 17px/1.2 var(--head);margin:0 0 12px;letter-spacing:-.005em}
.block{margin-top:38px}
.rule{border:0;border-top:1px solid var(--line);margin:0}
.banner{background:var(--amber-bg);color:#5B4108;padding:9px 14px;border-radius:8px;font-size:13.5px;margin-bottom:20px}

/* ── inicio ── */
.hello{font:700 clamp(34px,5.4vw,56px)/1.02 var(--head);letter-spacing:-.03em;margin:0 0 10px}
.lead{font-size:18px;line-height:1.5;color:var(--ink2);max-width:62ch;margin:0 0 30px}
.lead b{color:var(--ink);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.kpi{padding:16px 18px 16px 0}
.kpi+.kpi{padding-left:18px;border-left:1px solid var(--line)}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font:700 clamp(26px,3vw,36px)/1.15 var(--head);letter-spacing:-.02em;margin-top:2px}
.kpi .n{font-size:12.5px;color:var(--ink2);margin-top:2px}
.pos{color:var(--teal-d)} .neg{color:var(--rust)}

.tide{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.tide button{border:0;background:transparent;text-align:left;padding:12px 10px 10px 0;border-bottom:1px solid var(--line);position:relative;min-width:0}
.tide button+button{padding-left:10px;border-left:1px solid var(--line2)}
.tide button:hover{background:var(--line2)}
.tide .c{font:700 28px/1 var(--head)}
.tide .t{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.25;min-height:30px}
.tide .bar{height:4px;background:var(--line2);border-radius:2px;margin-top:8px;overflow:hidden}
.tide .bar i{display:block;height:100%;background:var(--teal);border-radius:2px}

.rows{border-top:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line2);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
button.row:hover{background:var(--line2)}
.row .who{font-weight:600;min-width:0}
.row .what{color:var(--ink2);flex:1;min-width:0}
.row .when{color:var(--muted);font-size:12.5px;white-space:nowrap}
.sev{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;align-self:flex-start}
.sev.rojo{background:var(--rust)} .sev.amarillo{background:#CA8A04}
.empty{padding:22px 0;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:42px}

/* ── clientes ── */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.fchips .chip{padding:5px 12px;font-size:13px}
table{width:100%;border-collapse:collapse}
th{font-weight:500;font-size:12.5px;color:var(--muted);text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--ink)}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--line2)}
td.r,th.r{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--blue-bg);color:#1E4A60;white-space:nowrap}
.pill.ok{background:var(--teal-bg);color:var(--teal-d)} .pill.ok{background:#D9F2E3;color:#0F6B3A}.pill.warn{background:var(--amber-bg);color:#6B4A06} .pill.bad{background:var(--rust-bg);color:#8A2E08} .pill.mute{background:var(--line2);color:var(--ink2)}
.tag{font-size:12px;color:var(--muted)}

/* ── ficha del cliente ── */
#scrim{position:fixed;inset:0;background:rgba(11,37,48,.38);z-index:20}
aside#ficha{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--surface);z-index:21;overflow:auto;padding:26px 26px 60px;box-shadow:-8px 0 30px rgba(11,37,48,.14);transform:translateX(0)}
.f-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.f-top h2{font:700 26px/1.1 var(--head);margin:0 0 6px;letter-spacing:-.02em}
.x{border:1px solid var(--line);background:transparent;border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1}
.steps{list-style:none;margin:22px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding-bottom:16px;position:relative}
.steps li:not(:last-child)::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.steps .pt{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;color:#fff;z-index:1}
.steps .done .pt{background:var(--teal);border-color:var(--teal)}
.steps .now .pt{border-color:var(--ink);background:var(--ink)}
.steps .todo{color:var(--muted)}
.steps .tt{font-weight:600}
.steps .dd{font-size:13.5px;color:var(--ink2)}
.steps a{color:var(--teal-d);font-weight:500}
.acts{margin-top:8px;padding-top:20px;border-top:1px solid var(--line)}
.acts .line{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.acts select,.acts input[type=text],.acts input[type=password]{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex:1;min-width:140px}
.hist{margin-top:22px}
.hist li{list-style:none;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.hist ul{margin:0;padding:0}
.hist .w{color:var(--muted);font-size:12px}

/* ── finanzas / gráficos ── */
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
svg text{font-family:var(--body);fill:var(--muted);font-size:11px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.hb .tr{height:10px;background:var(--line2);border-radius:5px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:0 4px 4px 0}
details.tv{margin-top:10px;font-size:13px;color:var(--ink2)}
details.tv summary{cursor:pointer}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:6px;max-width:260px;display:none}

@media (max-width:860px){
  #app{grid-template-columns:1fr}
  nav.rail{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line);gap:6px;align-items:center}
  .brand{padding:0 8px 0 0;white-space:nowrap}.brand small{display:none}
  .nav-b{width:auto;white-space:nowrap}.rail-foot{display:none}
  .kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){padding-left:0;border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .tide{grid-template-columns:repeat(3,1fr)}
  .two{grid-template-columns:1fr;gap:10px}
  th.hide-s,td.hide-s{display:none}
}

/* ── marca Poseidón ── */
nav.rail{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);border-right:0;color:#EAF1FB}
.brand{display:flex;align-items:center;gap:10px;color:#fff;padding:0 6px 22px}
.brand img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 2px #1D4F86,0 0 14px rgba(43,157,255,.6);background:#000;flex:none}
.brand small{color:#8494AD}
.nav-b{color:#B7C4D9}
.nav-b:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-b[aria-current=page]{background:linear-gradient(90deg,#0A6CE0,#2B9DFF);color:#fff}
.rail-foot{color:#8494AD}
.rail-foot .btn.ghost{color:#EAF1FB;border-color:#294066}.rail-foot .btn.ghost:hover{background:rgba(255,255,255,.08)}
.hero{position:relative;overflow:hidden;background:radial-gradient(700px 320px at 92% 0%,rgba(43,157,255,.34),transparent 60%),radial-gradient(500px 260px at 0% 120%,rgba(255,138,0,.20),transparent 60%),var(--navy);color:#fff;border-radius:14px;padding:30px clamp(20px,3vw,36px);margin-bottom:26px;display:flex;gap:24px;align-items:center;justify-content:space-between}
.hero .hello{color:#fff;margin:0 0 10px}
.hero .lead{color:#C5D2E6;margin:0}.hero .lead b{color:#fff}
.hero .fecha{font-size:13px;color:#8FA3C0;margin-bottom:8px}
.hero img{width:clamp(84px,11vw,132px);height:auto;flex:none;border-radius:50%;filter:drop-shadow(0 0 24px rgba(43,157,255,.6))}
.login-box .lg{display:block;width:92px;height:92px;margin:0 0 18px;border-radius:50%;filter:drop-shadow(0 0 22px rgba(43,157,255,.55))}
#login{background:radial-gradient(900px 480px at 80% -10%,rgba(43,157,255,.18),transparent 60%),var(--paper)}
.btn{background:var(--navy)}.btn:hover{background:#12213D}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy)}
th{border-bottom-color:var(--navy)}
.kpis{border-top-color:var(--navy)}
.tide .bar i{background:linear-gradient(90deg,#0A6CE0,#38E0FF)}
.pill.gold{background:#FFF1D1;color:#7A4B00}
.sn{font-size:13px;color:var(--ink2)}
.seg{display:inline-flex;gap:6px;align-items:center}
.lnk{border:0;background:transparent;color:var(--teal-d);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:2px}
@media (max-width:860px){
  nav.rail{background:var(--navy)}
  .brand{padding:0 8px 0 0}.brand img{width:30px;height:30px}
  .hero{flex-direction:column-reverse;align-items:flex-start;padding:22px 20px}.hero img{width:64px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section id="login">
  <form class="login-box" id="loginForm" autocomplete="off">
    <img class="lg" data-logo alt="Poseidón">
    <h1>Panel Poseidón</h1>
    <p>Solo para el equipo. La clave no se guarda: se pide cada vez que abres el panel.</p>
    <div class="chips" role="group" aria-label="¿Quién eres?">
      <button type="button" class="chip" data-quien="Alejandro" aria-pressed="true">Alejandro</button>
      <button type="button" class="chip" data-quien="Mario" aria-pressed="false">Mario</button>
    </div>
    <label class="field">Clave de equipo
      <input id="lgClave" type="password" autocomplete="new-password" placeholder="••••••••" required>
    </label>
    <button class="btn" id="lgBtn" type="submit">Entrar</button>
    <div class="msg" id="lgMsg" role="status" aria-live="polite"></div>
  </form>
</section>

<div id="app" hidden>
  <nav class="rail" aria-label="Secciones">
    <div class="brand"><img data-logo alt=""><div>Poseidón<small>Panel gerencial</small></div></div>
    <button class="nav-b" data-v="inicio" aria-current="page">Inicio</button>
    <button class="nav-b" data-v="clientes">Clientes <span class="dot" id="navAl" hidden></span></button>
    <button class="nav-b" data-v="contratos">Contratos</button>
    <button class="nav-b" data-v="finanzas">Finanzas</button>
    <button class="nav-b" data-v="equipo">Equipo</button>
    <button class="nav-b" data-v="gerencial">Gerencial</button>
    <div class="rail-foot"><span id="gen">—</span><br><button class="btn ghost" id="btnRef" type="button">Actualizar</button> <button class="btn ghost" id="btnOut" type="button">Salir</button></div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>

<div id="scrim" hidden></div>
<aside id="ficha" hidden aria-label="Ficha del cliente"></aside>
<div id="tip" role="tooltip"></div>

(function(){
'use strict';
var API = 'https://mkposeidon.com/webhook/contrato';
var DEMO = location.hash === '#demo';
var CLAVE = '', QUIEN = 'Alejandro', D = null, VISTA = 'inicio', FILTRO = 'abiertos', BUSCA = '', PERIODO = 3, TIPO_MOV = 'todos';

var ESTADOS = [
  ['requerimiento_recibido','Requerimiento'],['propuesta_en_elaboracion','Propuesta en elaboración'],['propuesta_enviada','Propuesta enviada'],
  ['reunion_agendada','Reunión agendada'],['proforma_enviada','Proforma enviada'],['pagado','Pagado'],['contrato_enviado','Contrato enviado'],
  ['contrato_firmado','Contrato firmado'],['activo','Activo'],['pausado','Pausado'],['retirado','Retirado'],['perdido','Perdido']];
var NOM = {}; ESTADOS.forEach(function(e){ NOM[e[0]] = e[1]; });
var RANGO = {}; ESTADOS.slice(0,9).forEach(function(e,i){ RANGO[e[0]] = i; });
var CERRADOS = ['retirado','perdido'];
var CAMBIABLES = [['propuesta_en_elaboracion','Propuesta en elaboración'],['reunion_agendada','Reunión agendada'],['activo','Activo'],['pausado','Pausado'],['retirado','Retirado (pide motivo)'],['perdido','Perdido (pide motivo)']];

var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(v){ return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function usd(n, d){ n = Number(n)||0; return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d?2:0,maximumFractionDigits:2}); }
function ecuNow(){ return new Date(Date.now() - 5*3600000); }
function mesKey(d){ return d.toISOString().slice(0,7); }
var MES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function mesTxt(k){ return MES_C[parseInt(k.slice(5,7),10)-1] + ' ' + k.slice(2,4); }
function dias(iso){ return iso ? Math.max(0, Math.floor((Date.now() - new Date(iso).getTime())/86400000)) : 0; }
function cuando(iso){ if(!iso) return '—'; var d = new Date(new Date(iso).getTime() - 5*3600000); var p=function(n){return String(n).padStart(2,'0');}; return d.getUTCDate()+' '+MES_C[d.getUTCMonth()]+' '+d.getUTCFullYear()+' · '+p(d.getUTCHours())+':'+p(d.getUTCMinutes()); }
function hace(iso){ var d = dias(iso); return d === 0 ? 'hoy' : d === 1 ? 'ayer' : 'hace '+d+' días'; }
function safeUrl(u){ return /^https:\/\//.test(String(u||'')) ? u : null; }

/* ── llamadas al servidor ── */
function limpio(t){ t = String(t==null?'':t); return CLAVE ? t.split(CLAVE).join('••••') : t; }
function api(accion, extra){
  if (DEMO) return Promise.resolve(demoRespuesta(accion, extra));
  var cuerpo = Object.assign({ accion: accion, clave: CLAVE }, extra || {});
  return fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(cuerpo) })
    .then(function(r){ return r.json(); })
    .catch(function(){ return { ok:false, error:'RED', mensaje:'No hay conexión con el servidor. Revisa tu internet e intenta de nuevo.' }; });
}

/* ── acceso ── */
document.querySelectorAll('img[data-logo]').forEach(function(i){ i.src = LOGO; });
try { var q = localStorage.getItem('panel_quien'); if (q === 'Mario' || q === 'Alejandro') QUIEN = q; } catch(e){}
function marcarQuien(){ $$('.chip[data-quien]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.quien === QUIEN ? 'true' : 'false'); }); }
marcarQuien();
$$('.chip[data-quien]').forEach(function(b){ b.addEventListener('click', function(){ QUIEN = b.dataset.quien; try{ localStorage.setItem('panel_quien', QUIEN); }catch(e){} marcarQuien(); }); });
$('#loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var ms = $('#lgMsg'), btn = $('#lgBtn');
  if (!DEMO && !$('#lgClave').value.trim()) return;
  CLAVE = $('#lgClave').value; btn.disabled = true; ms.className = 'msg'; ms.textContent = 'Entrando…';
  cargar().then(function(ok){
    btn.disabled = false;
    if (ok) { $('#lgClave').value = ''; $('#login').hidden = true; $('#app').hidden = false; pintar(); }
    else { CLAVE = ''; }
  });
});
$('#btnOut').addEventListener('click', function(){ CLAVE=''; D=null; cerrarFicha(); $('#app').hidden = true; $('#login').hidden = false; $('#lgMsg').textContent=''; });
$('#btnRef').addEventListener('click', function(){ cargar().then(function(ok){ if(ok) pintar(); }); });

var ULTIMA = 0;
function refrescarSolo(){
  if (!D || document.hidden || !CLAVE) return;
  var a = document.activeElement; if (!$('#ficha').hidden || (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) return;
  cargar().then(function(ok){ if (ok) pintar(); });
}
setInterval(refrescarSolo, 5*60000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden && D && Date.now()-ULTIMA > 3*60000) refrescarSolo(); });
function cargar(){
  return api('panel').then(function(r){
    if (!r || r.ok !== true) { var ms=$('#lgMsg'); ms.className='msg'; ms.textContent = limpio((r && r.mensaje) || 'No se pudo entrar.'); return false; }
    D = r; ULTIMA = Date.now(); indexar(); return true;
  });
}

/* ── datos derivados ── */
var CT_POR_CASO = {};
function indexar(){
  CT_POR_CASO = {};
  (D.contratos||[]).forEach(function(c){ if (!CT_POR_CASO[c.caso]) CT_POR_CASO[c.caso] = c; });
  D.casos.forEach(function(c){ c._ct = CT_POR_CASO[c.codigo] || null; c._dias = dias(c.estado_desde); c._al = alertaDe(c); c._nombre = c.empresa || c.cliente_nombre || 'Sin nombre'; });

var C_ING = '#0A6CE0', C_GAS = '#E07B00';
function vFinanzas(){

  if (!D.transacciones) return h + '<p class="empty">No se pudo leer la tabla de movimientos'+(D.error_finanzas?' ('+esc(D.error_finanzas)+')':'')+'. El resto del panel sigue funcionando.</p>';
  var ms = meses(6), ing = ms.map(function(m){return sumaMes('ingreso',m);}), gas = ms.map(function(m){return sumaMes('gasto',m);});
  h += '<div class="kpis">'+
    kpi('Ingresos del mes', usd(ing[5]), 'vs '+usd(ing[4])+' el mes pasado')+
    kpi('Gastos del mes', usd(gas[5]), 'vs '+usd(gas[4])+' el mes pasado')+
    kpi('Resultado del mes', usd(ing[5]-gas[5]), ing[5]-gas[5]>=0?'a favor':'en contra', ing[5]-gas[5]>=0?'pos':'neg')+
    kpi('Link de pago sin pagar', String(D.transacciones.filter(function(t){return t.estado==='pendiente' && t.tipo==='ingreso';}).length), 'pendientes de confirmar')+'</div>';
  h += '<div class="block"><h3>Últimos 6 meses</h3><div class="legend"><span><i style="background:'+C_ING+'"></i>Ingresos</span><span><i style="background:'+C_GAS+'"></i>Gastos</span></div>'+barras(ms, ing, gas)+
    '<details class="tv"><summary>Ver como tabla</summary><table><thead><tr><th>Mes</th><th class="r">Ingresos</th><th class="r">Gastos</th><th class="r">Resultado</th></tr></thead><tbody>'+ms.map(function(m,i){return '<tr><td>'+mesTxt(m)+'</td><td class="r num">'+usd(ing[i])+'</td><td class="r num">'+usd(gas[i])+'</td><td class="r num">'+usd(ing[i]-gas[i])+'</td></tr>';}).join('')+'</tbody></table></details></div>';
  var per = [[1,'Este mes'],[3,'3 meses'],[12,'12 meses']];
  var keys = meses(PERIODO);
  h += '<div class="block"><div class="fchips">'+per.map(function(p){return '<button class="chip" data-per="'+p[0]+'" aria-pressed="'+(PERIODO===p[0])+'">'+p[1]+'</button>';}).join('')+'</div><div class="two"><div><h3>De dónde entra</h3>'+porCategoria('ingreso', keys, C_ING)+'</div><div><h3>En qué se va</h3>'+porCategoria('gasto', keys, C_GAS)+'</div></div></div>';

function barras(ms, a, b){
  var W=680, H=220, pl=44, pb=26, pt=10, n=ms.length, max=Math.max.apply(null, a.concat(b).concat([1]));
  var paso = Math.pow(10, Math.floor(Math.log(max)/Math.LN10)); var tope = Math.ceil(max/paso)*paso; if (tope/paso<2) tope = paso*2;
  var gw=(W-pl)/n, bw=Math.min(26,gw/3), y=function(v){ return pt+(H-pt-pb)*(1-v/tope); };
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ingresos y gastos de los últimos 6 meses" style="width:100%;height:auto;display:block">';
  [0,.5,1].forEach(function(f){ var v=tope*f; s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#E6ECEA"/><text x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+usd(v)+'</text>'; });
  ms.forEach(function(m,i){ var cx=pl+gw*i+gw/2;
    [[a[i],C_ING,'Ingresos',-bw-1],[b[i],C_GAS,'Gastos',1]].forEach(function(p){ var hgt=Math.max(p[0]>0?2:0,(H-pb)-y(p[0]));
      s+='<rect data-tip="'+mesTxt(m)+' · '+p[2]+': '+usd(p[0],true)+'" x="'+(cx+p[3])+'" y="'+((H-pb)-hgt)+'" width="'+bw+'" height="'+hgt+'" rx="3" fill="'+p[1]+'"/>'; });
    s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+mesTxt(m)+'</text>'; });
  return s+'</svg>';
}
function porCategoria(tipo, keys, color){
  var m = {}, total = 0;
  trans().forEach(function(t){ if (t.tipo!==tipo || keys.indexOf(String(t.fecha||'').slice(0,7))<0) return; var k=t.categoria||'Sin categoría'; m[k]=(m[k]||0)+(Number(t.monto)||0); total+=Number(t.monto)||0; });
  var arr = Object.keys(m).map(function(k){return [k,m[k]];}).sort(function(a,b){return b[1]-a[1];});
  if (!arr.length) return '<p class="empty">Sin movimientos en este periodo.</p>';
  var top = arr.slice(0,6), resto = arr.slice(6).reduce(function(a,x){return a+x[1];},0); if (resto>0) top.push(['Otros', resto]);
  var mx = top[0][1];
  return top.map(function(x){ return '<div class="hb" data-tip="'+esc(x[0])+': '+usd(x[1],true)+' ('+Math.round(x[1]/total*100)+'%)"><span>'+esc(x[0])+'</span><span class="tr"><i style="width:'+Math.round(x[1]/mx*100)+'%;background:'+color+'"></i></span><span class="num">'+usd(x[1])+'</span></div>'; }).join('');
}

function exportarCsv(){
  var filas = (D.transacciones||[]).filter(function(t){ return TIPO_MOV==='todos' || t.tipo===TIPO_MOV; });
  var cab = ['fecha','tipo','monto','categoria','subcategoria','descripcion','cliente','proveedor','metodo_pago','estado','registrado_por'];
  var csv = [cab.join(',')].concat(filas.map(function(t){ return cab.map(function(k){ var v = String(t[k]==null?'':t[k]).replace(/"/g,'""'); return /^[=+\-@]/.test(v) ? '"\'' + v + '"' : '"'+v+'"'; }).join(','); })).join('\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'})); a.download = 'poseidon-movimientos-'+ecuNow().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ═════════ GERENCIAL ═════════ */
function vGerencial(){
  var h = '<h2 class="sec">Gerencial</h2><p class="sub">Cómo convierte Poseidón a sus clientes y cuánto vale lo contratado.</p>';
  var todos = D.casos.filter(function(c){ return ['ecosistema','campana','directo'].indexOf(c.tipo)>=0 || true; });
  var total = todos.length || 1;
  var etapas = ESTADOS.slice(0,9).map(function(e,i){ var n = todos.filter(function(c){ var r = RANGO[c.estado]; return r!==undefined && r>=i; }).length; return [e[1], n]; });
  var pagados = todos.filter(function(c){ return c.pago_confirmado_en; });
  var ticket = pagados.length ? pagados.reduce(function(a,c){return a+(Number(c.proforma_total)||0);},0)/pagados.length : 0;
  var ciclo = pagados.length ? pagados.reduce(function(a,c){ return a+Math.max(0,(new Date(c.pago_confirmado_en)-new Date(c.created_at))/86400000); },0)/pagados.length : 0;
  var firmados = (D.contratos||[]).filter(function(c){return c.estado==='firmado' && !c.modo_prueba;});
  var valorFirmado = firmados.reduce(function(a,c){return a+(Number(c.total)||0);},0);
  h += '<div class="kpis">'+kpi('Cierre', Math.round(pagados.length/total*100)+'%', pagados.length+' de '+todos.length+' casos pagaron')+kpi('Ticket promedio', pagados.length?usd(ticket):'—', 'proforma sin IVA')+kpi('Días hasta el pago', pagados.length?ciclo.toFixed(1):'—', 'desde el requerimiento')+kpi('Valor contratado', usd(valorFirmado), firmados.length+' contrato'+(firmados.length===1?'':'s')+' firmado'+(firmados.length===1?'':'s')+' (con IVA)')+'</div>';
  var mx = etapas[0][1] || 1;
  h += '<div class="block"><h3>Embudo: cuántos llegaron a cada etapa</h3>'+etapas.map(function(x){ return '<div class="hb" data-tip="'+esc(x[0])+': '+x[1]+' de '+todos.length+'"><span>'+esc(x[0])+'</span><span class="tr"><i style="width:'+Math.round(x[1]/mx*100)+'%;background:var(--teal)"></i></span><span class="num">'+x[1]+' · '+Math.round(x[1]/total*100)+'%</span></div>'; }).join('')+'</div>';
  var cer = D.casos.filter(function(c){ return CERRADOS.indexOf(c.estado)>=0; });
  h += '<div class="block"><h3>Casos cerrados y por qué</h3>'+(cer.length?'<div class="rows">'+cer.map(function(c){ return '<button class="row" data-caso="'+esc(c.codigo)+'"><span class="what"><span class="who">'+esc(c._nombre)+'</span> — '+esc(c.motivo_cierre||'sin motivo escrito')+'</span><span class="when">'+esc(NOM[c.estado])+'</span></button>'; }).join('')+'</div>':'<p class="empty">Ningún caso cerrado.</p>')+'</div>';
  return h;
}
